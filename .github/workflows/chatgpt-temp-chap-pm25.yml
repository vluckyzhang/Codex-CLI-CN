name: Temporary CHAP PM2.5 panel extraction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/chatgpt_pm25_extract.py
      - .github/workflows/chatgpt-temp-chap-pm25.yml

permissions:
  contents: read

jobs:
  extract-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            requests==2.32.3 \
            xarray==2025.1.2 \
            netCDF4==1.7.2 \
            geopandas==1.0.1 \
            rasterio==1.4.3 \
            shapely==2.0.6 \
            pyproj==3.7.0 \
            pyogrio==0.10.0

      - name: Download, verify and aggregate CHAP annual files
        run: python .github/scripts/chatgpt_pm25_extract.py

      - name: Display quality-control summary
        run: |
          ls -lh output
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output/metadata.json').read_text(encoding='utf-8'))
          print(json.dumps(m['quality_checks'], ensure_ascii=False, indent=2))
          assert m['quality_checks']['actual_records'] == 390
          assert m['quality_checks']['unique_keys'] == 390
          assert m['quality_checks']['missing_values'] == 0
          PY

      - name: Upload panel output
        uses: actions/upload-artifact@v4
        with:
          name: chap-pm25-china-30-provinces-2012-2024
          path: output/
          if-no-files-found: error
          retention-days: 1
