name: Temporary EPIC AQLI PM2.5 panel extraction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/chatgpt_aqli_pm25_extract.py
      - .github/workflows/chatgpt-temp-chap-pm25.yml

permissions:
  contents: read

jobs:
  extract-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and extract official EPIC AQLI GADM1 data
        run: python .github/scripts/chatgpt_aqli_pm25_extract.py

      - name: Display quality-control summary
        run: |
          ls -lh output_aqli
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output_aqli/metadata.json').read_text(encoding='utf-8'))
          print(json.dumps(m['quality_checks'], ensure_ascii=False, indent=2))
          assert m['quality_checks']['actual_records'] == 390
          assert m['quality_checks']['unique_province_year_keys'] == 390
          assert m['quality_checks']['missing_values'] == 0
          PY

      - name: Upload official AQLI panel output
        uses: actions/upload-artifact@v4
        with:
          name: epic-aqli-pm25-china-30-provinces-2012-2024
          path: output_aqli/
          if-no-files-found: error
          retention-days: 1
